# Layer 3: the safety net. This is the portable gate: Terraform pushes it into onboarded repos
# (gate_mode = "repo") or the org ruleset runs it as a required workflow (gate_mode = "org").
# Results land in the GitHub Security tab. Blocking is risk-based: critical/high secrets and
# high-severity SAST/SCA fail the check; everything else is reported without stopping the merge.
#
# Supply chain: every action is pinned to a full commit SHA (tag in the comment) and the
# Semgrep image to a digest. Dependabot keeps the pins current.
name: secret-guard

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-guard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: secret-guard            # the required status check in terraform/
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write      # upload SARIF
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0          # full history so gitleaks can scan every commit in the change
          persist-credentials: false

      - name: Resolve the range to scan
        id: range
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          base="${PR_BASE:-$PUSH_BEFORE}"
          if [ -z "$base" ] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            base="$(git rev-list --max-parents=0 HEAD | tail -n 1)"   # new branch: scan everything
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"
          for p in guard/secret_guard.py .github/secret-guard/secret_guard.py; do
            if [ -f "$p" ]; then echo "engine=$p" >> "$GITHUB_OUTPUT"; exit 0; fi
          done
          echo "engine=.secret-guard-src/guard/secret_guard.py" >> "$GITHUB_OUTPUT"

      - name: Fetch the engine from the central repo (org required-workflow mode)
        if: steps.range.outputs.engine == '.secret-guard-src/guard/secret_guard.py'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ vars.SECRET_GUARD_REPO }}
          path: .secret-guard-src
          sparse-checkout: guard
          persist-credentials: false

      - name: Gitleaks (every commit in this change)
        env:
          BASE: ${{ steps.range.outputs.base }}
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/repo" -w /repo \
            zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git /repo --config /repo/.gitleaks.toml --log-opts="${BASE}..HEAD" \
            --report-format sarif --report-path /repo/gitleaks.sarif --redact --exit-code 1

      - name: secret_guard (changed files, org rules)
        if: always()
        env:
          BASE: ${{ steps.range.outputs.base }}
          GUARD: ${{ steps.range.outputs.engine }}
          SECRET_GUARD_FP_KEY: ${{ secrets.SECRET_GUARD_FP_KEY }}
        run: |
          # NUL-separated so filenames with spaces or leading dashes cannot break the command
          git diff -z --name-only --diff-filter=ACMR "$BASE" HEAD > changed.z
          python3 "$GUARD" scan --stage ci --files-from changed.z --null \
            --format sarif --output secret_guard.sarif --fail-on high

      - name: Upload gitleaks SARIF
        if: always() && hashFiles('gitleaks.sarif') != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          sarif_file: gitleaks.sarif
          category: secrets-gitleaks

      - name: Upload secret_guard SARIF
        if: always() && hashFiles('secret_guard.sarif') != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          sarif_file: secret_guard.sarif
          category: secrets-guard

  sast:
    name: semgrep
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    container:
      image: semgrep/semgrep:1.185.0@sha256:67518c174185a2043fdbed16c70631b79209499b3671178e7194379b48295a0d
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: semgrep scan --config p/owasp-top-ten --config p/secrets --metrics=off --sarif --output semgrep.sarif --error --severity ERROR
      - if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          sarif_file: semgrep.sarif
          category: sast

  dependencies:
    name: trivy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Trivy (dependencies + misconfiguration)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scanners: vuln,misconfig
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: sarif
          output: trivy.sarif
          exit-code: "1"
      - if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          sarif_file: trivy.sarif
          category: sca
